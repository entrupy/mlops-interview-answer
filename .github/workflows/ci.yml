name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install latest Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: poetry install --no-root --no-interaction
      - run: poetry run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install latest Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: poetry install --no-root --no-interaction
      - name: Export requirements.txt for Docker
        run: poetry export -f requirements.txt --output requirements.txt --without-hashes
      - run: docker build . -t ml-interview-app:ci
      - run: docker run -d --name test-api -p 8000:8000 ml-interview-app:ci
      - run: sleep 5
      - run: "curl -f -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{\"text\": \"hello\"}'"
      - if: always()
        run: docker stop test-api && docker rm test-api